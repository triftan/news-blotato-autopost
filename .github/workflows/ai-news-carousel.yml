name: AI News Carousel

on:
  schedule:
    # 03:00 UTC every day. That is 11:00 in Malaysia (UTC+8).
    # Change the hour and minute here if you want a different posting time.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build slides and save artifacts but skip Instagram post'
        type: boolean
        default: false

permissions:
  contents: write            # Allows committing posted_urls.json back to repo

concurrency:
  group: instagram-post      # Only one run at a time — prevents double-posts from concurrent retries
  cancel-in-progress: false  # Queue, don't cancel — retries should still run

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check config placeholders
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python config_check.py

      - name: Set up Python
        if: ${{ steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: ${{ steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true' }}
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pipeline
        if: ${{ steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true' }}
        run: python pipeline.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Commit posted_urls.json
        if: ${{ steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          git diff --staged --quiet || git commit -m "chore: update posted_urls [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

      - name: Upload slide artifacts (for inspection)
        if: ${{ always() && steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides-${{ github.run_id }}
          path: ~/Downloads/carousels/
          retention-days: 7
