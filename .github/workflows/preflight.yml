name: Preflight

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - name: Verify Buffer channel and API keys
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python << 'PY'
          import os
          import sys

          import requests

          import config_check
          import poster

          cfg = config_check.load_config()
          fields = config_check.placeholder_fields(cfg)
          if fields:
              print(config_check.friendly_message(fields))
              print("Preflight failed before calling Buffer. Replace the placeholders in config.json, then run this again.")
              sys.exit(1)

          failed = False
          for name in ("OPENROUTER_API_KEY", "PIXABAY_API_KEY", "BUFFER_API_KEY"):
              if not os.environ.get(name, "").strip():
                  print(f"Preflight failed: the {name} secret is missing or empty.")
                  print("Add it under Settings > Secrets and variables > Actions > Repository secrets.")
                  failed = True
          if failed:
              sys.exit(1)

          key = requests.get(
              "https://openrouter.ai/api/v1/key",
              headers={"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY'].strip()}"},
              timeout=30,
          )
          if key.status_code != 200:
              print(f"Preflight failed: OpenRouter rejected OPENROUTER_API_KEY (HTTP {key.status_code}).")
              sys.exit(1)
          print("OpenRouter key OK.")

          pix = requests.get(
              "https://pixabay.com/api/",
              params={"key": os.environ["PIXABAY_API_KEY"].strip(), "q": "city", "per_page": 3},
              timeout=30,
          )
          if pix.status_code != 200:
              print(f"Preflight failed: Pixabay rejected PIXABAY_API_KEY (HTTP {pix.status_code}).")
              sys.exit(1)
          print("Pixabay key OK.")

          buf = cfg["buffer"]
          try:
              poster.validate_account(buf["channel_id"], buf["instagram_username"])
          except RuntimeError as exc:
              print(f"Preflight failed: {exc}")
              if "BUFFER_API_KEY" in str(exc):
                  print("Add BUFFER_API_KEY under Settings > Secrets and variables > Actions.")
              else:
                  print(
                      "Check buffer.channel_id in config.json is the id of an Instagram channel "
                      "in the same Buffer account as BUFFER_API_KEY."
                  )
              sys.exit(1)
          print("All checks passed.")
          PY
